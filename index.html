<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOBIS 일일 박스오피스</title>
    <meta name="description" content="영화진흥위원회 KOBIS 오픈 API 기반의 실시간 일일 박스오피스 순위 및 영화 상세 정보 조회 서비스입니다." />
    <meta property="og:title" content="KOBIS 일일 박스오피스" />
    <meta property="og:description" content="영화진흥위원회 KOBIS 오픈 API 기반의 실시간 일일 박스오피스 순위 및 영화 상세 정보 조회 서비스입니다." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      try {
        const saved = localStorage.getItem('apple_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f5f5f7] dark:bg-[#000000] text-[#1d1d1f] dark:text-[#f5f5f7] antialiased selection:bg-[#0071e3]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
